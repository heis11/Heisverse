# =====================================================================
# HEISVERSE â€” Multi-Container Docker Compose Architecture
# Services:
#   1. app: PHP 8.2 + Apache web server
#   2. db:  MySQL 8.0 database engine with persistent volume
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heisverse_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-heisverse}
      DB_USER: ${DB_USER:-heisverse_user}
      DB_PASS: ${DB_PASS:-heisverse_secure_pass_2026}
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET: ${APP_SECRET:-e7b41e9e03d98bb55f0dcbc6793a5db8c9423c89ff5287fbd5f492b498263a41}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-gmail}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HEISVERSE}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - heisverse_net

  db:
    image: mysql:8.0
    container_name: heisverse_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-heisverse}
      MYSQL_USER: ${DB_USER:-heisverse_user}
      MYSQL_PASSWORD: ${DB_PASS:-heisverse_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-heisverse_root_pass_2026}
    ports:
      - "3306:3306"
    volumes:
      # Persistent named volume - never lost during container restarts or docker compose down
      - db_data:/var/lib/mysql
      # Automatically initializes database tables and seeds on first container boot
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - heisverse_net

volumes:
  db_data:
    name: heisverse_db_data

networks:
  heisverse_net:
    name: heisverse_network
    driver: bridge
