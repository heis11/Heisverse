<!DOCTYPE html>
<html lang="en" data-theme="dark-cinematic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — HEISVERSE</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .offline-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--border-radius-lg);
      padding: 3rem 2rem;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">📡</div>
    <h1 style="font-size: 1.8rem; margin-bottom: 0.5rem;">You are Offline</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      HEISVERSE requires an active internet connection to stream authorized video trailers and load live catalog data.
    </p>
    <button class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
